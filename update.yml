name: 보조지표 자동 갱신

on:
  schedule:
    # 하루 두 번(미국장 마감 후 / 한국장 마감 후)으로 잡아봤지만 소용이 없었다.
    # 깃허브 무료 러너가 예약 작업을 몇 시간씩 밀어서 돌린다. 2026-08-02~08-06 커밋
    # 이력을 보면 21시대(UTC) 예약이 매번 다음날 07~08시(UTC)에야 결과를 남겼고,
    # 그 전 7/28~8/1에 21:30 크론 하나만 있던 기간에도 커밋이 전부 06:46~08:17(UTC)
    # 였다. 즉 "몇 시에 돌려라"를 지정하는 방식 자체가 이 러너에서는 안 먹힌다.
    #
    # 그래서 시각을 노리는 대신 촘촘하게 돌린다. 2시간마다면 몇 시간 밀려도 한국 아침에는
    # 직전 미국장 마감분이 들어와 있다. 공개 저장소라 Actions 사용 시간은 무료·무제한이다.
    # :00은 전 세계 작업이 몰려 더 밀리므로 일부러 :17분으로 어긋냈다.
    #
    # 2026-09-24: 시간대를 손으로 골랐다. 두 가지를 피하거나 노린다.
    #  (1) 피할 것 — UTC 00~05시(미 동부 20시~다음날 01시). 이 시간대에는 야후가
    #      방금 끝난 하루치 일봉을 잠깐 빼놓는다. 9월 4·8·9·10·11일 실행이 모두
    #      이 시간대에서 화면을 하루 전으로 되돌렸다. 아예 예약을 두지 않는다.
    #  (2) 노릴 것 — 미국 종가와 한국 종가. 깃허브 무료 러너는 예약분을 자주
    #      통째로 건너뛴다(9월 22~23일에는 하루 12번 중 2번만 돌았다). 그래서
    #      중요한 두 시각에는 한 번이 아니라 세 번씩 걸어 둔다.
    - cron: "17 21,22,23 * * *"      # 미 동부 17:17·18:17·19:17 — 미국 종가
    - cron: "17 7,8,9 * * *"         # 한국 16:17·17:17·18:17 — 한국 종가
    - cron: "17 5,6,11,13,15,17,19 * * *"   # 그 밖의 시간(한국 장중 포함)
  workflow_dispatch: {}

permissions:
  contents: write

# 2시간마다 돌리다 보면 앞 실행이 밀려서 겹칠 수 있다. 겹치면 git push가 서로 충돌하므로
# 한 번에 하나만 돌게 묶어둔다. 진행 중인 건 죽이지 않고 끝나기를 기다린다.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        # lxml이 없으면 yfinance가 실적일 페이지를 못 읽어서 일부 종목이 "미확인"으로 남는다.
        # (2026-08-05 로그: "[warn] AMD earnings_dates: `Import lxml` failed" 외 6건)
        # pandas_market_calendars: 공식 거래일 달력. 야후가 거래일을
        # 통째로 빼먹었는지 대조하는 데 쓴다. 설치가 실패해도 스크립트는
        # 그 검사만 건너뛰고 정상 동작한다.
        run: pip install yfinance pandas lxml pandas_market_calendars

      - name: 보조지표 계산 및 index.html 갱신
        env:
          # 하이일드 스프레드용 FRED 무료 API 키. 저장소 Settings > Secrets에 넣어둔 값이
          # 여기로 들어온다. 키가 없으면 그 칸만 "확인 필요"로 남고 나머지는 정상 동작한다.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_dashboard.py index.html

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ath_cache.json은 사상최고 값을 저장해 두는 파일이다. 이게 같이 커밋돼야
          # 다음 실행이 전체 기간 조회(4분)를 건너뛰고 저장된 값을 쓸 수 있다.
          # run_log.json: 실행마다 무엇을 보고 무엇을 결정했는지 남긴 기록.
          # 건너뛴 실행도 여기에는 남으므로 이 파일만 커밋될 수 있다.
          git add index.html
          [ -f run_log.json ] && git add run_log.json || true
          [ -f ath_cache.json ] && git add ath_cache.json || true
          git diff --cached --quiet && exit 0
          git commit -m "보조지표 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 영재님이 직접 올린 커밋과 겹쳐도 밀리지 않게 한 번 당겨오고 올린다
          git pull --rebase
          git push
