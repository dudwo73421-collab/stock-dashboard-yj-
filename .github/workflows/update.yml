name: 보조지표 자동 갱신

on:
  schedule:
    # 깃허브 무료 러너는 예약 작업이 밀린다. 특히 정각(:00)과 반(:30)에 전 세계
    # 작업이 몰려서 30분~1시간씩 늦게 돌기도 한다. 그래서 일부러 어중간한 분(:37, :43)에 맞췄다.

    # (1) UTC 21:37 = 한국시간 오전 6:37 — 미국장 마감 후. 한국 월~토 아침.
    #     UTC 일~금(0-5)이 한국 월~토 아침이 된다. (예전 1-5는 한국 월요일 아침이 비었다)
    - cron: "37 21 * * 0-5"
    # (2) UTC 06:43 = 한국시간 오후 3:43 — 한국장(15:30) 마감 직후. 한국 월~금.
    #     이게 없으면 한국 종목은 다음날 아침까지 15시간 묵은 값이 보인다.
    - cron: "43 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install yfinance pandas

      - name: 보조지표 계산 및 index.html 갱신
        run: python update_dashboard.py index.html

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "보조지표 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 영재님이 직접 올린 커밋과 겹쳐도 밀리지 않게 한 번 당겨오고 올린다
          git pull --rebase
          git push
