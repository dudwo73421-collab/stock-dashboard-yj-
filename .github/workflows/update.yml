name: 보조지표 자동 갱신

on:
  schedule:
    # 매일 UTC 21:30 = 한국시간 오전 6:30 (미국장 마감 후), 화~토
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install yfinance pandas

      - name: 보조지표 계산 및 index.html 갱신
        run: python update_dashboard.py index.html

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "보조지표 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
